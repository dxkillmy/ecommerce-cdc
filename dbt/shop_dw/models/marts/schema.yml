version: 2

models:
  - name: fact_sales
    columns:
      - name: sales_key
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: stock_code
        tests:
          - relationships:
              to: ref('dim_product')
              field: stock_code
      - name: date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key