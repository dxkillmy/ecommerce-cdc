version: 2

models:
  - name: fact_sales
    columns:
      - name: sales_key
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id
              config:
                where: "_ingested_at < now() - interval '15 minutes'"
      - name: stock_code
        tests:
          - relationships:
              to: ref('dim_product')
              field: stock_code
              config:
                where: "_ingested_at < now() - interval '15 minutes'"
      - name: date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
              config:
                where: "_ingested_at < now() - interval '15 minutes'"